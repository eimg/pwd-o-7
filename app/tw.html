<!doctype html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
        @custom-variant dark (&:where(.dark, .dark *));
    </style>
</head>
<body>
    <div id="alert" class="container max-w-md mx-auto">
        <div class="p-4 bg-purple-200 dark:bg-purple-800 text-purple-800 dark:text-purple-200 rounded-lg border-purple-300 dark:border-purple-600 border">
            Lorem ipsum dolor sit amet.
        </div>

        <ul class="mt-5 bg-slate-200 dark:bg-slate-700 p-2">
            <li class="p-3 bg-white dark:bg-slate-800 dark:text-white mb-2">Item One</li>
            <li class="p-3 bg-white dark:bg-slate-800 dark:text-white mb-2">Item Two</li>
            <li class="p-3 bg-white dark:bg-slate-800 dark:text-white">Item Three</li>
        </ul>
    </div>

    <script>
        document.querySelector("#alert").onclick = () => {
            document.querySelector("body").classList.toggle("dark");
        }
    </script>
</body>
</html>
